1|name: Build Android APK
2|
3|on:
4|  push:
5|    branches: [main]
6|  workflow_dispatch:
7|
8|jobs:
9|  build:
10|    runs-on: ubuntu-latest
11|
12|    steps:
13|      - uses: actions/checkout@v4
14|
15|      - name: Setup Flutter
16|        uses: subosito/flutter-action@v2
17|        with:
18|          channel: stable
19|
20|      - name: Install dependencies
21|        run: flutter pub get
22|
23|      - name: Build APK (release)
24|        run: flutter build apk --release --split-per-abi
25|
26|      - name: Rename APK
27|        run: |
28|          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/千尚.apk
29|
30|      - name: Upload APK
31|        uses: actions/upload-artifact@v4
32|        with:
33|          name: 千尚
34|          path: build/app/outputs/flutter-apk/千尚.apk
35|